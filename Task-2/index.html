<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Dynamic Task Manager & Productivity Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Glow Orbs -->
  <div class="bg-orb orb-1" aria-hidden="true"></div>
  <div class="bg-orb orb-2" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header with Title & Stats -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">TaskFlow</h1>
          <p class="brand-subtitle">Dynamic Task Manager & Productivity Tracker</p>
        </div>
      </div>

      <!-- Live Counters -->
      <div class="stats-grid">
        <div class="stat-card stat-total">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="counter-total">0</span>
        </div>
        <div class="stat-card stat-active">
          <span class="stat-label">Active</span>
          <span class="stat-value" id="counter-active">0</span>
        </div>
        <div class="stat-card stat-completed">
          <span class="stat-label">Completed</span>
          <span class="stat-value" id="counter-completed">0</span>
        </div>
      </div>
    </header>

    <!-- Task Creation Input Bar -->
    <section class="card form-card">
      <form id="task-form" autocomplete="off">
        <div class="form-grid">
          <div class="input-group title-group">
            <label for="task-title-input">Task Title</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <input type="text" id="task-title-input" placeholder="What needs to be done?" required maxlength="120">
            </div>
          </div>

          <div class="input-group">
            <label for="task-category-select">Category</label>
            <div class="input-wrapper">
              <select id="task-category-select">
                <option value="Work">💼 Work</option>
                <option value="Personal">🏡 Personal</option>
                <option value="Study">📚 Study</option>
              </select>
            </div>
          </div>

          <div class="input-group">
            <label for="task-due-date-input">Due Date</label>
            <div class="input-wrapper">
              <input type="date" id="task-due-date-input">
            </div>
          </div>

          <button type="submit" id="add-task-btn" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Task</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Toolbar: Search & Filters -->
    <section class="toolbar-section">
      <!-- Search Input -->
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search by title or category..." aria-label="Search tasks">
        <button type="button" id="search-clear-btn" class="search-clear-btn hidden" aria-label="Clear search">✕</button>
      </div>

      <!-- Filter Controls & Actions -->
      <div class="filter-controls">
        <div class="filter-tabs" role="tablist">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="active">Active</button>
          <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <button type="button" id="clear-completed-btn" class="btn btn-ghost" title="Clear all completed tasks">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Clear Completed</span>
        </button>
      </div>
    </section>

    <!-- Drag & Drop Hint -->
    <div class="dnd-hint" id="dnd-hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="12" r="1"></circle>
        <circle cx="9" cy="5" r="1"></circle>
        <circle cx="9" cy="19" r="1"></circle>
        <circle cx="15" cy="12" r="1"></circle>
        <circle cx="15" cy="5" r="1"></circle>
        <circle cx="15" cy="19" r="1"></circle>
      </svg>
      <span>Drag and drop tasks to reorder them</span>
    </div>

    <!-- Task List Container -->
    <main class="task-list-wrapper">
      <ul id="task-list" class="task-list" aria-label="Task list">
        <!-- Dynamically populated via script.js -->
      </ul>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <path d="M8 14h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M16 14h.01"></path>
            <path d="M8 18h.01"></path>
            <path d="M12 18h.01"></path>
            <path d="M16 18h.01"></path>
          </svg>
        </div>
        <h3 id="empty-title" class="empty-title">No tasks found</h3>
        <p id="empty-desc" class="empty-desc">Create your first task above to start tracking your productivity!</p>
      </div>
    </main>
  </div>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-wrapper">
          <div class="modal-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </div>
          <h2 id="edit-modal-title" class="modal-title">Edit Task</h2>
        </div>
        <button type="button" id="edit-modal-close" class="modal-close-btn" aria-label="Close modal">✕</button>
      </div>

      <form id="edit-task-form">
        <input type="hidden" id="edit-task-id">
        <div class="modal-body">
          <div class="input-group">
            <label for="edit-task-title">Task Title</label>
            <input type="text" id="edit-task-title" required maxlength="120">
          </div>

          <div class="modal-body-row">
            <div class="input-group">
              <label for="edit-task-category">Category</label>
              <select id="edit-task-category">
                <option value="Work">💼 Work</option>
                <option value="Personal">🏡 Personal</option>
                <option value="Study">📚 Study</option>
              </select>
            </div>

            <div class="input-group">
              <label for="edit-task-due-date">Due Date</label>
              <input type="date" id="edit-task-due-date">
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="edit-modal-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
